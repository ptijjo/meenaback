openapi: 3.0.3
info:
  title: Meena API
  version: 1.0.0
  description: API documentation for Meena backend
servers:
  - url: http://localhost:8585
    description: Development server
tags:
  - name: users
    description: users API
paths:
  /users:
    get:
      tags:
        - users
      summary: Find All Users
      responses:
        '200':
          description: OK
        '500':
          description: Server Error
    post:
      tags:
        - users
      summary: Add User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '409':
          description: Conflict
        '500':
          description: Server Error
  /users/{id}:
    get:
      tags:
        - users
      summary: Find User By Id
      parameters:
        - name: id
          in: path
          description: User Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
        '409':
          description: Conflict
        '500':
          description: Server Error
    put:
      tags:
        - users
      summary: Update User By Id
      parameters:
        - name: id
          in: path
          description: User Id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '409':
          description: Conflict
        '500':
          description: Server Error
    delete:
      tags:
        - users
      summary: Delete User By Id
      parameters:
        - name: id
          in: path
          description: User Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
        '409':
          description: Conflict
        '500':
          description: Server Error
components:
  schemas:
    User:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: user Email
        password:
          type: string
          description: user Password
